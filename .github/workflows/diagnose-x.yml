name: X認証の診断(一時)

# 原因特定のための一時的なワークフロー。解決したらこのファイルごと削除する
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: 検証用ライブラリを導入
        run: pip install --quiet requests requests-oauthlib

      - name: 認証情報の形式と疎通を確認
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python3 diagnose_x.py
