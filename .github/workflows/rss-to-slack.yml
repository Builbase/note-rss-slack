name: note RSS to Slack

on:
  schedule:
    - cron: "*/15 * * * *"  # 15分毎(実際は数分〜十数分遅延することあり)
  workflow_dispatch: {}      # 手動実行(動作確認・障害時の再実行用)

permissions:
  contents: write  # 既読状態ファイルをコミットするために必要

concurrency:
  group: rss-to-slack
  cancel-in-progress: false

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: RSSをチェックしてSlackに投稿
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NOTE_RSS_URL: ${{ vars.NOTE_RSS_URL }}
        run: python3 rss_to_slack.py

      - name: 既読状態をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet seen_guids.json 2>/dev/null || [ -n "$(git status --porcelain seen_guids.json)" ]; then
            git add seen_guids.json
            git commit -m "chore: 既読GUIDを更新 [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          else
            echo "状態に変化なし"
          fi